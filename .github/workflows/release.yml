name: Release

# Push a tag like v1.2.0 to build Shotshelf-1.2.0.dmg and publish it as a GitHub release.
# Signing and notarization turn on when these repository secrets exist:
#   MACOS_CERTIFICATE           base64 of a "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD  its password
#   SIGN_IDENTITY               e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPSTORE_API_KEY            base64 of an App Store Connect API key (.p8), for notarytool
#   APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER     that key's Key ID and Issuer ID
#   (or APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD to notarize with an app-specific password)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.2.0 (no release is published)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "SHOTSHELF_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build DMG
        env:
          APPSTORE_API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPSTORE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$APPSTORE_API_KEY" ]; then
            export NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
            echo "$APPSTORE_API_KEY" | base64 --decode > "$NOTARY_KEY"
          fi
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          tools/release.sh "$VERSION"
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Shotshelf-${{ env.VERSION }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Shotshelf-$VERSION.dmg dist/Shotshelf-$VERSION.dmg.sha256 \
            --title "Shotshelf $VERSION" --notes-file .github/release-notes.md --generate-notes
